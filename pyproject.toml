[project]
name = "thothy"
version = "0.0.1"
description = "An AI agent platform"
authors = [
    { name = "Thothy", email = "ai.thothy@gmail.com" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.55",
    "langgraph-checkpoint>=2.0.16",
    "langgraph-checkpoint-postgres>=2.0.15",
    "langgraph-sdk>=0.1.32",
    "langmem>=0.0.15",
    "langchain-openai>=0.3.7",
    "langchain-anthropic>=0.3.9",
    "langchain>=0.3.9",
    "langchain-core>=0.3.9",
    "langchain-community>=0.3.9",
    "langchain-groq>=0.2.4",
    "psycopg[binary,pool]>=3.2.5",
    "exa-py>=1.8.9",
    "linkup-sdk>=0.2.3",
    "openai>=1.61.0",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.3",
    "pymupdf>=1.25.3",
    "xmltodict>=0.14.2",
    "httpx>=0.28.1",
    "PyJWT>=2.10.1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chat_graph", "research_graph", "open_deep_research_graph", "security"]

[tool.setuptools.package-dir]
# Chat graph
"chat_graph" = "agents/chat_agent/src/chat_graph"
"thothy.chat_graph" = "agents/chat_agent/src/chat_graph"

# Research graph
"research_graph" = "agents/research_agent/src/research_graph"
"thothy.research_graph" = "agents/research_agent/src/research_graph"

# Open deep research graph
"open_deep_research_graph" = "agents/open_deep_research_agent/src/open_deep_research_graph"
"thothy.open_deep_research_graph" = "agents/open_deep_research_agent/src/open_deep_research_graph"

# Security module
"security" = "agents/security"
"thothy.security" = "agents/security"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
include = ["*.py", "*.pyi", "*.ipynb"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
[tool.ruff.lint.pydocstyle]
convention = "google"
