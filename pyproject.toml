[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thothy"
version = "0.0.1"
description = "Thothy monorepo containing multiple Python agent projects"
authors = [
    { name = "Thothy", email = "ai.thothy@gmail.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

# Common development dependencies for all projects
[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
]

# Define the monorepo structure for setuptools
[tool.setuptools]
# Tell setuptools not to automatically discover packages
packages = []
# Or alternatively, you can specify exactly what to include
# packages = ["thothy"]
# package-dir = {"thothy" = "thothy"}

# Common tool configurations
[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
include = ["*.py", "*.pyi", "*.ipynb"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true 