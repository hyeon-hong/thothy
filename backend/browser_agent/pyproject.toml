[project]
name = "browser_agent"
version = "0.0.1"
description = "A vision-enabled web-browsing agent capable of controlling the mouse and keyboard"
authors = [
    { name = "Thothy", email = "ai.thothy@gmail.com" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.55",
    "langchain>=0.3.9",
    "langchain-core>=0.3.9",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.7",
    "langchain-anthropic>=0.3.9",
    "pydantic>=2.0.0",
    "typing-extensions>=4.10.0",
    "aiohttp>=3.9.3",
    "playwright>=1.39.0",
    "pillow>=10.0.0",
    "nest-asyncio>=1.5.8",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["browser_graph", "thothy.browser_graph"]
[tool.setuptools.package-dir]
"browser_graph" = "src/browser_graph"
"thothy.browser_graph" = "src/browser_graph"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
include = ["*.py", "*.pyi", "*.ipynb"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
[tool.ruff.lint.pydocstyle]
convention = "google" 