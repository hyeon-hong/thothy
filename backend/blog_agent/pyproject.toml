[project]
name = "blog_agent"
version = "0.0.1"
description = "An agent that can fetch and process blog content."
authors = [
    { name = "Thothy", email = "ai.thothy@gmail.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.7",
    "langgraph-checkpoint>=2.0.25",
    "langgraph-sdk>=0.1.66",
    "langgraph-prebuilt>=0.1.8",
    "langchain>=0.3.25",
    "langchain-core>=0.3.63",
    "langchain-openai>=0.3.18",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "supabase>=2.10.1",
    "uuid",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blog_graph", "thothy.blog_graph"]
[tool.setuptools.package-dir]
"blog_graph" = "src/blog_graph"
"thothy.blog_graph" = "src/blog_graph"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
include = ["*.py", "*.pyi", "*.ipynb"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_errors = true
